<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KartiStar_bot — Звезды и Telegram Premium</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="glass-container">
        <div class="card">
            <!-- Шапка с логотипом и названием -->
            <header class="card-header">
                <div class="logo">⭐</div>
                <h1>KartiStar_bot</h1>
                <p class="subtitle"> сервис пополнения</p>

            </header>

            <main>
                <!-- Блок с ценами и товарами -->
                <div class="pricing">
                    <div class="price-box">
                        <h3>100 Звезд</h3>
                        <p class="price">137 ₽</p>
                    </div>
                    <div class="price-box">
                        <h3>500 Звезд</h3>
                        <p class="price">685 ₽</p>
                    </div>
                    <div class="price-box highlight">
                        <span class="badge">Хит</span>
                        <h3>TG Premium</h3>
                        <p class="price">3 месяца 1099 ₽</p>
                    </div>
                </div>

                <!-- Преимущества в три колонки -->
                <div class="features">
                    <div class="feature-item">⚡ Быстро (1 мин)</div>
                    <div class="feature-item">🔒 Безопасно</div>
                    <div class="feature-item">💎 Гарантия</div>
                </div>

                <!-- Кнопка действия -->
                <a href="https://t.me/kartistar_bot" target="_blank" class="btn">Перейти в @kartistar_bot</a>
            </main> <!-- Блок с QR-кодом -->
            <div class="qr-section">
                <img src="qr-code.png" alt="QR-код @kartistar_bot" class="qr-img">
                <p class="qr-text">Наведи камеру, чтобы открыть бота</p>
            </div>

            <!-- Подвал с гарантией -->
            <footer>
                <p>Более 1,000+ довольных клиентов</p>
            </footer>
        </div>
    </div>
</body>

</html>
