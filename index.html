<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>karti</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Этот контейнер будет держать эффект стекла -->
    <div class="glass-container">
        <div class="card">
            <header>
                <h1>Звезды в Telegram по лучшей цене</h1>
            </header>
            <main>
                <p>Самый быстрый способ пополнить баланс через @kartistar_bot</p>

                <!-- Блок с ценами -->
                <div class="pricing">
                    <div class="price-box">
                        <h3>100 ⭐</h3>
                        <p class="price">135 ₽</p>
                    </div>
                    <div class="price-box">
                        <h3>500 ⭐</h3>
                        <p class="price">685 ₽</p>
                    </div>
                    <div class="price-box highlight">
                        <h3>TG Premium</h3>
                        <p class="price">от 1099 ₽</p>
                    </div>
                </div>

                <a href="https://t.me/kartistar_bot" target="_blank" class="btn">Перейти в бота</a>
            </main>
        </div>
    </div>
</body>
